name: verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python tools
        run: python -m pip install -r requirements.txt
      - name: Install frontend
        run: npm ci --prefix frontend
      - name: Lint contract
        env:
          PYTHONUTF8: '1'
        run: genvm-lint check contracts/canonmerge.py
      - name: Direct tests
        env:
          PYTHONUTF8: '1'
        run: python -m pytest tests/direct -q
      - name: Frontend check
        run: npm --prefix frontend run check

